name: Backend persistence tests

on:
  pull_request:
    paths:
      - 'backend-server/**'
      - 'web-demo/**'
      - 'ai-service/**'
      - 'scripts/verify-live-integration.cjs'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: coach_test
          MYSQL_USER: coach
          MYSQL_PASSWORD: ci-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Standard Maven lifecycle with H2
        working-directory: backend-server
        run: mvn -B -ntp verify
      - name: Repeat business integration tests against MySQL 8.4
        working-directory: backend-server
        env:
          TEST_DATABASE_URL: jdbc:mysql://127.0.0.1:3306/coach_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          TEST_DATABASE_USER: coach
          TEST_DATABASE_PASSWORD: ci-test-only
        run: mvn -B -ntp test
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install real Mock AI service
        run: python -m pip install -r ai-service/requirements.txt
      - name: Verify Spring Boot to Uvicorn and persistence across restart
        env:
          USE_MOCK_LLM: 'true'
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_DATABASE: coach_test
          MYSQL_USER: coach
          MYSQL_PASSWORD: ci-test-only
          AI_SERVICE_URL: http://127.0.0.1:8006
          INTEGRATION_TEST_STATE: ${{ runner.temp }}/synthetic-integration-state.json
        shell: bash
        run: |
          set -euo pipefail
          python -m uvicorn app.main:app --app-dir ai-service --host 127.0.0.1 --port 8006 > "$RUNNER_TEMP/ai.log" 2>&1 &
          ai_pid=$!
          java -jar backend-server/target/backend-server-0.1.0.jar --server.port=8085 > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" "$ai_pid" 2>/dev/null || true' EXIT
          wait_health() {
            for attempt in {1..60}; do
              if curl --fail --silent --max-time 2 "$1" >/dev/null; then return 0; fi
              sleep 1
            done
            tail -n 60 "$RUNNER_TEMP/backend.log" "$RUNNER_TEMP/ai.log"
            return 1
          }
          wait_health http://127.0.0.1:8006/health
          wait_health http://127.0.0.1:8085/api/health
          node scripts/verify-live-integration.cjs
          kill "$backend_pid"
          wait "$backend_pid" || true
          java -jar backend-server/target/backend-server-0.1.0.jar --server.port=8085 > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          wait_health http://127.0.0.1:8085/api/health
          node scripts/verify-live-integration.cjs --verify-only
