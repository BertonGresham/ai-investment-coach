name: Backend persistence tests

on:
  pull_request:
    paths:
      - 'backend-server/**'
      - 'web-demo/**'
      - '.github/workflows/backend-tests.yml'
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-only
          MYSQL_DATABASE: coach_test
          MYSQL_USER: coach
          MYSQL_PASSWORD: ci-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pci-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Standard Maven lifecycle with H2
        working-directory: backend-server
        run: mvn -B -ntp verify
      - name: Repeat business integration tests against MySQL 8.4
        working-directory: backend-server
        env:
          TEST_DATABASE_URL: jdbc:mysql://127.0.0.1:3306/coach_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          TEST_DATABASE_USER: coach
          TEST_DATABASE_PASSWORD: ci-test-only
        run: mvn -B -ntp test
