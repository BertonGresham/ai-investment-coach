name: AI service tests

on:
  pull_request:
    paths:
      - "ai-service/**"
      - "web-demo/**"
      - ".github/workflows/ai-service-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check market context state and stale responses
        run: node --test web-demo/tests/*.test.cjs
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install AI service dependencies
        run: python -m pip install -r requirements.txt
        working-directory: ai-service
      - name: Compile Python sources
        run: python -m compileall -q app scripts tests
        working-directory: ai-service
      - name: Run behavior analysis tests
        run: python -m unittest discover -s tests -v
        working-directory: ai-service
      - name: Check integration examples without external APIs
        run: python scripts/smoke_test.py --in-process
        working-directory: ai-service
