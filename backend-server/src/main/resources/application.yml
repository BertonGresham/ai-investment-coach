server:
  port: 8080

spring:
  application:
    name: ai-investment-coach-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_investment_coach}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USER:coach}
    password: ${MYSQL_PASSWORD:coach_password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

services:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8001}
  data-service-url: ${DATA_SERVICE_URL:http://localhost:8002}


